<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ML Hub — Customer Intelligence Assistant</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f8;
    --panel: #ffffff;
    --border: #e2e2e6;
    --text: #1c1c1e;
    --muted: #6b6b70;
    --accent: #0f5fdc;
    --accent-ink: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121214;
      --panel: #1c1c1f;
      --border: #2e2e32;
      --text: #eeeeef;
      --muted: #9a9a9f;
      --accent: #5b9bff;
      --accent-ink: #08131f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }
  header h1 {
    font-size: 1.4rem;
    margin: 0 0 4px;
  }
  header p {
    margin: 0 0 24px;
    color: var(--muted);
    font-size: 0.95rem;
  }
  .config {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 20px;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .config input {
    flex: 1;
    font-size: 0.85rem;
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
  }
  .examples {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 16px;
  }
  .chip {
    font-size: 0.8rem;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
  }
  .chip:hover { border-color: var(--accent); }
  form {
    display: flex;
    gap: 8px;
    margin-bottom: 28px;
  }
  textarea {
    flex: 1;
    resize: none;
    min-height: 52px;
    font-size: 0.95rem;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-family: inherit;
  }
  textarea:focus, input:focus { outline: 2px solid var(--accent); }
  button {
    padding: 0 20px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: var(--accent-ink);
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  .thread { display: flex; flex-direction: column; gap: 16px; }
  .turn {
    border: 1px solid var(--border);
    background: var(--panel);
    border-radius: 12px;
    padding: 16px 18px;
  }
  .q {
    font-weight: 600;
    margin-bottom: 10px;
  }
  .a { white-space: pre-wrap; line-height: 1.5; }
  .a.error { color: #c0392b; }
  details {
    margin-top: 12px;
    font-size: 0.82rem;
    color: var(--muted);
  }
  summary { cursor: pointer; }
  .tool-call {
    margin-top: 8px;
    padding: 8px 10px;
    border-radius: 8px;
    background: var(--bg);
    border: 1px solid var(--border);
  }
  .tool-name { font-weight: 600; color: var(--text); }
  pre {
    margin: 4px 0 0;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 0.78rem;
  }
  .empty { color: var(--muted); font-size: 0.9rem; }
  .spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ML Hub — Customer Intelligence Assistant</h1>
    <p>Ask a question about customers, churn risk, CLV, or RMOs in plain English. Every answer is grounded in the warehouse and every tool call is logged for audit.</p>
  </header>

  <div class="config">
    <label for="aiUrl">AI service URL:</label>
    <input id="aiUrl" type="text" value="http://localhost:8001" />
  </div>

  <div class="examples">
    <button type="button" class="chip" data-q="Which customers are most likely to churn?">Which customers are most likely to churn?</button>
    <button type="button" class="chip" data-q="Which customers have the highest CLV?">Highest CLV customers</button>
    <button type="button" class="chip" data-q="Which RMO manages the most customers?">Which RMO manages the most customers?</button>
    <button type="button" class="chip" data-q="Tell me about customer R000000001">Look up customer R000000001</button>
  </div>

  <form id="askForm">
    <textarea id="question" placeholder="e.g. Which retail customers should we contact about a personal loan?"></textarea>
    <button id="askBtn" type="submit">Ask</button>
  </form>

  <div class="thread" id="thread">
    <p class="empty">No questions asked yet. Try one of the examples above.</p>
  </div>
</div>

<script>
  const form = document.getElementById('askForm');
  const input = document.getElementById('question');
  const thread = document.getElementById('thread');
  const askBtn = document.getElementById('askBtn');
  const aiUrlInput = document.getElementById('aiUrl');

  document.querySelectorAll('.chip').forEach((chip) => {
    chip.addEventListener('click', () => {
      input.value = chip.dataset.q;
      input.focus();
    });
  });

  function clearEmptyState() {
    const empty = thread.querySelector('.empty');
    if (empty) empty.remove();
  }

  function renderTurn(question) {
    clearEmptyState();
    const el = document.createElement('div');
    el.className = 'turn';
    el.innerHTML = `
      <div class="q">${escapeHtml(question)}</div>
      <div class="a"><span class="spinner"></span>Thinking…</div>
    `;
    thread.prepend(el);
    return el;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function renderResult(el, data) {
    const answerEl = el.querySelector('.a');
    answerEl.textContent = data.answer || '(no answer returned)';

    if (data.tool_calls && data.tool_calls.length) {
      const details = document.createElement('details');
      const summary = document.createElement('summary');
      summary.textContent = `How this was answered (${data.tool_calls.length} tool call${data.tool_calls.length > 1 ? 's' : ''})`;
      details.appendChild(summary);
      data.tool_calls.forEach((call) => {
        const div = document.createElement('div');
        div.className = 'tool-call';
        div.innerHTML = `<span class="tool-name">${escapeHtml(call.tool)}</span><pre>${escapeHtml(JSON.stringify(call.input, null, 2))}</pre>`;
        details.appendChild(div);
      });
      el.appendChild(details);
    }
  }

  function renderError(el, message) {
    const answerEl = el.querySelector('.a');
    answerEl.classList.add('error');
    answerEl.textContent = message;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const question = input.value.trim();
    if (!question) return;

    const aiUrl = aiUrlInput.value.trim().replace(/\/$/, '');
    const turnEl = renderTurn(question);
    input.value = '';
    askBtn.disabled = true;

    try {
      const resp = await fetch(`${aiUrl}/ask`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question }),
      });
      if (!resp.ok) {
        throw new Error(`AI service returned ${resp.status}`);
      }
      const data = await resp.json();
      renderResult(turnEl, data);
    } catch (err) {
      renderError(turnEl, `Could not reach the AI service at ${aiUrl}. Is it running? (${err.message})`);
    } finally {
      askBtn.disabled = false;
    }
  });
</script>
</body>
</html>
